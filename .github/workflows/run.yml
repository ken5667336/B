name: rpow miner runner

on:
  workflow_dispatch:
    inputs:
      account:
        description: "Nomor akun (1 atau 2)"
        required: true
        default: "1"
      count:
        description: "Jumlah token yang mau di-mine"
        required: true
        default: "10"
      workers:
        description: "Jumlah CPU workers"
        required: true
        default: "2"
      engine:
        description: "Engine mining (native atau node)"
        required: true
        default: "native"

jobs:
  mine:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Download semua file yang dibutuhkan
        run: |
          curl -L https://github.com/ken5667336/compiler/releases/download/v01/rpow-native-miner -o rpow-native-miner
          curl -L https://github.com/ken5667336/compiler/releases/download/v01/rpow-cli.js -o rpow-cli.js
          curl -L https://github.com/ken5667336/compiler/releases/download/v01/rpow-miner-worker.js -o rpow-miner-worker.js
          curl -L https://github.com/ken5667336/compiler/releases/download/v01/index.js -o index.js
          chmod +x rpow-native-miner
          ls -la

      - name: Restore sesi akun ${{ github.event.inputs.account }}
        env:
          STATE_JSON: ${{ secrets[format('RPOW_STATE_{0}', github.event.inputs.account)] }}
        run: |
          echo "$STATE_JSON" > .rpow-${{ github.event.inputs.account }}.json

      - name: Validasi state file
        run: |
          echo "Isi state file:"
          cat .rpow-${{ github.event.inputs.account }}.json
          node -e "JSON.parse(require('fs').readFileSync('.rpow-${{ github.event.inputs.account }}.json','utf8'))" && echo "✅ JSON valid" || echo "❌ JSON tidak valid"

      - name: Jalankan mining
        run: |
          node rpow-cli.js mine \
            --count ${{ github.event.inputs.count }} \
            --workers ${{ github.event.inputs.workers }} \
            --engine ${{ github.event.inputs.engine }} \
            --state .rpow-${{ github.event.inputs.account }}.json

      - name: Cek saldo setelah mining
        run: |
          node rpow-cli.js me \
            --state .rpow-${{ github.event.inputs.account }}.json
