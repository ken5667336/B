name: rpow - step 1 request login

on:
  workflow_dispatch:
    inputs:
      email:
        description: "Your RPOW account email"
        required: true

jobs:
  request-login:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Download all the necessary files
        run: |
          curl -L https://github.com/ken5667336/compiler/releases/download/v01/rpow-cli.js -o rpow-cli.js
          curl -L https://github.com/ken5667336/compiler/releases/download/v01/rpow-miner-worker.js -o rpow-miner-worker.js
          curl -L https://github.com/ken5667336/compiler/releases/download/v01/index.js -o index.js
          ls -la

      - name: Request magic link
        run: |
          node rpow-cli.js login --email "${{ github.event.inputs.email }}"
          echo "✅ The magic link has been sent to your email!"
          echo "📧 Check your email and then proceed to step 2 of the workflow"
