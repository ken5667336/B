name: rpow - step 1 request login

on:
  workflow_dispatch:
    inputs:
      email:
        description: "Email akun RPOW kamu"
        required: true
      account:
        description: "Nomor akun (1 atau 2)"
        required: true
        default: "1"

jobs:
  request-login:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Download semua file yang dibutuhkan
        run: |
          curl -L https://github.com/ken5667336/compiler/releases/download/v01/rpow-cli.js -o rpow-cli.js
          curl -L https://github.com/ken5667336/compiler/releases/download/v01/rpow-miner-worker.js -o rpow-miner-worker.js
          curl -L https://github.com/ken5667336/compiler/releases/download/v01/index.js -o index.js
          ls -la

      - name: Request magic link
        run: |
          node rpow-cli.js login \
            --email "${{ github.event.inputs.email }}" \
            --state .rpow-${{ github.event.inputs.account }}.json
          echo "✅ Magic link dikirim ke email!"
          echo "📧 Cek email lalu jalankan workflow step 2"
          echo "📌 Gunakan nomor akun: ${{ github.event.inputs.account }}"
