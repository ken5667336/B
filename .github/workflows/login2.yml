name: rpow - step 2 complete login

on:
  workflow_dispatch:
    inputs:
      magic_link:
        description: "Paste magic link dari email kamu"
        required: true
      account:
        description: "Nomor akun (1 atau 2)"
        required: true
        default: "1"

jobs:
  complete-login:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Download semua file yang dibutuhkan
        run: |
          sleep 10

          curl -L https://github.com/ken5667336/compiler/releases/download/v01/rpow-cli.js -o rpow-cli.js
          curl -L https://github.com/ken5667336/compiler/releases/download/v01/rpow-miner-worker.js -o rpow-miner-worker.js
          curl -L https://github.com/ken5667336/compiler/releases/download/v01/index.js -o index.js
          ls -la

      - name: Complete login dengan magic link
        run: |
          sleep 20

          RPOW_VERBOSE=1 node rpow-cli.js complete-login \
            --link "${{ github.event.inputs.magic_link }}" \
            --state .rpow-${{ github.event.inputs.account }}.json

          # node rpow-cli.js complete-login \
          #   --link "${{ github.event.inputs.magic_link }}" \
          #   --state .rpow-${{ github.event.inputs.account }}.json

      - name: Verifikasi sesi
        run: |
          sleep 30

          node rpow-cli.js me \
            --state .rpow-${{ github.event.inputs.account }}.json

      - name: Tampilkan isi state file
        run: |
          echo "======= COPY ISI INI KE SECRET RPOW_STATE_${{ github.event.inputs.account }} ======="
          cat .rpow-${{ github.event.inputs.account }}.json
          echo "=================================================="
